<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rain of Light</title>
  <meta name="description" content="A field of points of light, with rain falling through it. Calm generative music; click for ripples.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rain of Light">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Rain of Light">
  <meta property="og:description" content="A field of points of light, with rain falling through it. Calm generative music; click for ripples.">
  <meta property="og:url" content="https://sf624.github.io/rain-of-light/">
  <meta property="og:image" content="https://sf624.github.io/rain-of-light/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage" role="img" aria-label="Points of light falling like rain"></canvas>

  <div class="overlay" id="overlay">
    <h1>Rain of Light</h1>
    <p>Click or tap for a ripple of light and sound</p>
  </div>

  <noscript><p class="fallback">This page needs JavaScript and WebGL.</p></noscript>
  <p class="fallback" id="fallback" hidden>This browser does not support WebGL2.</p>

  <!-- Before the module: a module that fails to load or throws still shows its error. -->
  <script>
    function showError(msg) {
      var el = document.getElementById('fallback');
      el.textContent = String(msg);
      el.style.whiteSpace = 'pre-wrap';
      el.style.fontSize = '13px';
      el.hidden = false;
    }
    addEventListener('error', function (e) { showError(e.message || e.error); });
    addEventListener('unhandledrejection', function (e) { showError(e.reason); });
  </script>
  <script type="module" src="main.js"></script>
  <script>
    // Offline support; a failed registration is not worth showing.
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
